<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aerostep Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="earth.js"></script>
<style>
:root{--bg:#15120f;--panel:#201b18;--line:#322b26;--amber:#FFB020;--text:#f4f0ea;--dim:#9b928a;--paper:#EFE6D2;--ink:#2a2418}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0907;color:var(--text);font-family:"Inter","Pretendard Variable",Pretendard,-apple-system,sans-serif;font-variant-numeric:tabular-nums;display:flex;justify-content:center;min-height:100vh}
.mono{font-family:"Inter","Pretendard Variable",Pretendard,-apple-system,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#phone{width:100%;max-width:420px;height:100vh;max-height:880px;margin:auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){#phone{border-radius:44px;border:8px solid #2a231e;height:860px}}
main{flex:1;overflow-y:auto;padding:56px 18px 96px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
nav{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(60,52,46,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 22px rgba(0,0,0,.45);z-index:40}
nav button{border:0;background:transparent;color:rgba(255,255,255,.62);border-radius:999px;padding:8px 17px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
nav button.on{background:#fff;color:#1a1612;font-weight:600}
h1{font-size:30px;line-height:1.05;margin:8px 0;letter-spacing:-.03em;font-weight:700}
.xw{font-family:"Inter","Pretendard Variable",Pretendard,-apple-system,sans-serif;letter-spacing:-.02em}
h2{font-size:12px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin:22px 0 8px;font-weight:600}
.btn{background:var(--amber);color:#1a1200;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;width:100%;cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
input.name{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font-size:17px;margin:10px 0}
/* ticket */
.scene{perspective:1100px;width:100%;margin:14px 0 0}
.tilt{transform-style:preserve-3d;transition:transform .12s linear;transform:translateZ(var(--z,0px)) scale(var(--s,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.tilt.lift{--z:34px;--s:1.04}
.ticket{position:relative;height:172px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
.ticket.flip{transform:rotateY(180deg)}
.ticket.intro{animation:spin 1.3s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{0%{transform:rotateY(-360deg) scale(.7);opacity:0}100%{transform:rotateY(0) scale(1);opacity:1}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;background:var(--paper);color:var(--ink);padding:16px 18px;overflow:hidden;
 background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:3px 3px;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.face.gold{background-color:#e8c872}
.face.back{transform:rotateY(180deg)}
.face::before,.face::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.face::before{left:-11px}.face::after{right:-11px}
.shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:radial-gradient(circle at var(--sx,50%) var(--sy,30%),rgba(255,255,255,.75),transparent 45%)}
.codes{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.code{font-size:40px;font-weight:800;letter-spacing:1px}
.small{font-size:9.5px;letter-spacing:1.5px;opacity:.6;text-transform:uppercase}
.row{display:flex;justify-content:space-between;margin-top:8px}
.barcode{height:34px;margin-top:8px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 11px,transparent 11px 12px)}
.emblem{position:absolute;right:16px;top:14px;width:34px;height:34px;border-radius:50%;background:conic-gradient(from var(--hue,0deg),#f6c,#6cf,#6f9,#fc6,#f6c);opacity:.65}
/* map */
#map{width:100%;height:230px;background:#080a10;border-radius:16px;border:1px solid var(--line);display:block}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--amber);transition:width .4s}
.stat{display:flex;gap:10px}.stat .card{flex:1;text-align:center}
.stat b{font-size:22px;display:block}.stat small{color:var(--dim);font-size:11px}
.sim{display:flex;gap:8px;flex-wrap:wrap}.sim button{flex:1;min-width:70px;background:var(--panel);border:1px dashed var(--amber);color:var(--amber);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
.city{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.city:last-child{border:0}.city .c{font-size:22px;font-weight:800;width:56px}.city .t{margin-left:auto;font-size:11px;color:var(--dim)}
.lock{color:var(--amber)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* modals */
.modal{overflow-y:auto;position:absolute;inset:0;background:rgba(5,7,11,.96);z-index:60;display:none;flex-direction:column;justify-content:center;padding:28px;text-align:center}
.modal.show{display:flex;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.bigstamp{width:200px;margin:20px auto;color:#e0524a;animation:thud .5s .4s cubic-bezier(.2,2,.4,1) both}
@keyframes thud{from{transform:scale(3) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.perk{text-align:left;margin:14px 0;line-height:1.9;font-size:15px}
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;z-index:90;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.hint{color:var(--dim);font-size:12px;line-height:1.5}
.btn{box-shadow:0 0 26px #FFB02044}
.chip{display:inline-block;background:rgba(10,14,22,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px 10px;border-radius:9px;font-size:11px;font-weight:600;color:#fff}
.chip.red{background:#c9435a}
.hero{position:relative;margin:-56px -18px 4px;height:370px;overflow:hidden;background:radial-gradient(circle,#ffffff30 0 1px,transparent 1.5px) 0 0/70px 70px,radial-gradient(circle,#ffffff20 0 1px,transparent 1.5px) 35px 35px/70px 70px,#05070b}
.hero svg{width:100%;height:100%;display:block}
.heroT{position:absolute;left:18px;right:18px;bottom:0;padding-top:70px;background:linear-gradient(transparent,var(--bg) 82%)}
.heroT h1{margin:2px 0 8px;font-size:30px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:6px 18px 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .tc{flex:0 0 72%;scroll-snap-align:center}
.tc{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:14px;
 background:radial-gradient(120% 80% at 50% 28%,var(--g2),var(--g1) 72%);box-shadow:0 16px 36px rgba(0,0,0,.5)}
.tc::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:4px 4px}
.tc::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 42%,rgba(0,0,0,.72))}
.tcTop,.tcBot{position:relative;z-index:2}.tcTop{display:flex;justify-content:space-between;align-items:flex-start}
.tcArt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:118px;margin-top:-34px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.4))}
.tcCoord{display:inline-block;background:#fff;color:#111;font-size:9px;padding:2px 6px;border-radius:3px}
.tcName{font-size:30px;font-weight:700;line-height:1.1;margin-top:6px}
.tcSub{font-size:12px;opacity:.9;margin-top:2px}.tcSteps{font-size:10px;opacity:.7;margin-top:6px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tli{position:relative;margin-bottom:10px}
.tli::before{content:"";position:absolute;left:-21px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px var(--bg)}
.tl.up .tli::before{background:var(--bg);border:2px solid var(--amber);width:6px;height:6px}
.tli.now::before{background:var(--amber);box-shadow:0 0 0 3px var(--bg),0 0 12px var(--amber)}
details.pick summary::-webkit-details-marker{display:none}
.circles{display:flex;justify-content:space-between}
.circ{width:74px;text-align:center;font-size:11px;color:#ffffffd0}
.circ i{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);font-style:normal;margin-bottom:6px}
.circ i small{font-size:15px}.circ i b{font-size:14px;font-family:"Inter","Pretendard Variable",Pretendard,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
/* airplane window */
.hero3{position:relative;overflow-x:clip;margin:-56px -18px 0;padding:46px 18px 14px;background:radial-gradient(ellipse at 50% 36%,#6a5642 0,#2e251e 40%,var(--bg) 74%)}
.win{position:relative;container-type:inline-size;width:calc(100% - 56px);margin:30px auto 0;aspect-ratio:955/1375;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .5s}
.wcv{display:block}
.win.zin{transform:scale(2.6);opacity:0}

.glass::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 52%,transparent 55%,rgba(0,0,0,.38)),linear-gradient(rgba(0,0,0,.4),transparent 14%)}
.glass::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(transparent 52%,rgba(0,0,0,.42))}
.glass>svg{position:absolute;inset:0}
.glare{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.15),transparent 30%,transparent 70%,rgba(255,255,255,.06))}
.drift{animation:drift 110s linear infinite}@keyframes drift{to{transform:translateX(-420px)}}
.wing{animation:wob 7s ease-in-out infinite;transform-origin:420px 480px}@keyframes wob{50%{transform:translateY(-3px) rotate(.25deg)}}
.navb{animation:navb 1.6s infinite}@keyframes navb{50%{opacity:.15}}
.strobe{animation:strb 2.4s infinite}@keyframes strb{0%,88%,100%{opacity:0}91%,96%{opacity:1}}
.hud{position:absolute;inset:0;z-index:2;padding:6cqw 10cqw 14cqw;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hRow{display:flex;justify-content:space-between;align-items:flex-start}
.hClock{font-size:13px;font-weight:700;letter-spacing:.06em}
.hRight{text-align:right;font-size:6.5px;letter-spacing:.16em;color:rgba(255,255,255,.85);line-height:1.5}
.hLine{display:flex;justify-content:space-between;font-size:6.5px;letter-spacing:.16em;color:rgba(255,255,255,.85);border-top:1px solid rgba(255,255,255,.2);padding-top:3px;margin-top:6px}
.hWave{display:block;width:100%;height:22px;margin-top:2px}
.hCity{font-weight:700;font-size:19px;line-height:1.05;letter-spacing:-.02em;margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hTag{font-style:normal;font-size:6.5px;font-weight:700;background:#fff;color:#111;padding:2px 5px;border-radius:2px;letter-spacing:.1em;text-shadow:none}
.hSub{font-size:7.5px;letter-spacing:.18em;color:rgba(255,255,255,.85);margin-top:2px}
.hCoord{display:flex;justify-content:space-between;align-items:center;font-size:6.5px;letter-spacing:.1em;color:rgba(255,255,255,.9);border-top:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2);padding:3px 0}
.hBig{font-weight:700;font-size:21px;letter-spacing:-.03em;line-height:1}
.hBig small{font-size:6.5px;font-weight:500;letter-spacing:.18em;margin-left:6px;opacity:.9}
.hKcal{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:6.5px;letter-spacing:.12em;color:rgba(255,255,255,.9)}.hKcal svg{flex:none}.hKcal em{font-style:normal;opacity:.6}
.hRows{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px;font-size:6px;letter-spacing:.1em}
.hRows div{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.2);padding-top:3px}
.hRows b{font-size:7.5px;padding:1px 3px;font-weight:600;white-space:nowrap}.hRows b.hi{background:#fff;color:#111;text-shadow:none}
.fh{position:absolute;inset:0;z-index:2;padding:26% 13% 12%;display:flex;flex-direction:column;justify-content:center;gap:16px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.fFT{display:flex;justify-content:space-between;align-items:center}
.fFT small,.fGrid small{display:block;font-size:7px;letter-spacing:.18em;opacity:.85}
.fFT b{display:block;font-family:"Inter","Pretendard Variable",Pretendard,-apple-system,sans-serif;font-size:22px;font-weight:700}
.fGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}.fGrid b{font-size:13px;font-weight:400}
.fBar{height:48px;border-top:1px dashed rgba(255,255,255,.2);padding-top:12px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px,#fff 8px 11px,transparent 11px 13px) content-box;opacity:.85}
.fr{position:absolute;inset:0;z-index:1;background:rgba(255,255,255,.16)}
.frLand{position:absolute;left:0;right:0;bottom:90px;z-index:1;display:flex;justify-content:center;gap:4px;font-size:112px;filter:blur(10px);opacity:.65}
/* boarding pass */
.tk2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#14110c;box-shadow:0 20px 40px rgba(0,0,0,.55)}
.tk2.back{transform:rotateY(180deg)}

.tkArt{position:absolute;inset:0}.tkArt svg{display:block}
.tk2 .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 70%);background-size:260% 260%;background-position:var(--sx,50%) var(--sy,50%)}
.tkPanel{position:relative;padding:14px 16px;font-family:"Inter","Pretendard Variable",Pretendard,-apple-system,sans-serif}

<script>
/* ===== Core (port of AerostepCore) ===== */
const KM_PER_STEP = 0.05, R = 6371.0088;
const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
const HOME = {iata:"ICN",name:"Seoul",lat:37.4602,lon:126.4407};
const CITIES = [
 {iata:"HND",name:"Tokyo",lat:35.5494,lon:139.7798,lm:"🗻",lmName:"Mt. Fuji"},
 {iata:"BKK",name:"Bangkok",lat:13.69,lon:100.7501,lm:"🛕",lmName:"Wat Arun"},
 {iata:"CDG",name:"Paris",lat:49.0097,lon:2.5479,lm:"🗼",lmName:"Eiffel Tower"},
 {iata:"JFK",name:"New York",lat:40.6413,lon:-73.7781,lm:"🗽",lmName:"Statue of Liberty",p:1},
 {iata:"LHR",name:"London",lat:51.47,lon:-0.4543,lm:"🕰️",lmName:"Big Ben",p:1},
 {iata:"SYD",name:"Sydney",lat:-33.9399,lon:151.1753,lm:"🎭",lmName:"Opera House",p:1},
 {iata:"DXB",name:"Dubai",lat:25.2532,lon:55.3657,lm:"🏙️",lmName:"Burj Khalifa",p:1},
 {iata:"FCO",name:"Rome",lat:41.8003,lon:12.2389,lm:"🏛️",lmName:"Colosseum",p:1},
 {iata:"SIN",name:"Singapore",lat:1.3644,lon:103.9915,lm:"🏨",lmName:"Marina Bay Sands",p:1},
 {iata:"LAX",name:"Los Angeles",lat:33.9416,lon:-118.4085,lm:"🌴",lmName:"Hollywood Sign",p:1},
];
const dist=(a,b)=>{const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);
 const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));};
const interp=(a,b,t)=>{t=Math.min(Math.max(t,0),1);const d=dist(a,b)/R;if(d<1e-9)return a;
 const l1=rad(a.lat),o1=rad(a.lon),l2=rad(b.lat),o2=rad(b.lon),f=Math.sin((1-t)*d)/Math.sin(d),g=Math.sin(t*d)/Math.sin(d);
 const x=f*Math.cos(l1)*Math.cos(o1)+g*Math.cos(l2)*Math.cos(o2),y=f*Math.cos(l1)*Math.sin(o1)+g*Math.cos(l2)*Math.sin(o2),z=f*Math.sin(l1)+g*Math.sin(l2);
 return {lat:deg(Math.atan2(z,Math.hypot(x,y))),lon:deg(Math.atan2(y,x))};};
const tierOf=km=>km<1500?{n:"Easy",km:150}:km<6000?{n:"Medium",km:500}:{n:"Long",km:2500};
const ANCH=[["South Korea",36.5,127.8],["Japan",36.2,138.3],["China",35,103],["Mongolia",46.8,103.8],["Kazakhstan",48,67],["Russia",60,90],["Thailand",15,101],["Vietnam",16,107],["India",22,79],["Iran",32,53],["Turkey",39,35],["Germany",51,10],["France",46.5,2.5],["United Kingdom",54,-2],["Italy",42.5,12.5],["Egypt",26,30],["Saudi Arabia",24,45],["Australia",-25,134],["Indonesia",-2,117],["Canada",56,-100],["the United States",39,-98],["Mexico",23,-102],["Brazil",-10,-52],["the Pacific Ocean",0,-160],["the Atlantic Ocean",25,-40],["the Indian Ocean",-15,80],["the Arctic",85,0]];
const region=p=>ANCH.reduce((m,a)=>{const d=dist(p,{lat:a[1],lon:a[2]});return d<m[0]?[d,a[0]]:m},[1e9,""])[1];
const flight=(city,steps)=>{const real=dist(HOME,city),tier=tierOf(real),req=Math.round(tier.km/KM_PER_STEP);
 const prog=Math.min(steps*KM_PER_STEP/tier.km,1),pos=interp(HOME,city,prog);
 return {real,tier,req,prog,pos,remain:Math.max(req-steps,0),walkedKm:Math.min(steps*KM_PER_STEP,tier.km)};};

/* ===== State ===== */
const KEY="aerostep.proto.v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{name:"",trips:[],premium:false,seat:"14A",today:0,visited:[]};

/* ===== Feedback ===== */
const vib=p=>navigator.vibrate&&navigator.vibrate(p);
let ac;const tone=(f,t,d,g=.15)=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();
 o.type="sine";o.frequency.value=f;v.gain.setValueAtTime(g,ac.currentTime+t);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(v);v.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)};

/* ===== Views ===== */
const DAILY_STEPS=8000, md=iso=>iso.slice(5).replace("-","."), pad2=n=>String(n).padStart(2,"0");
const lerp=(a,b,t)=>a+(b-a)*t, hexRGB=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,t)=>{const x=hexRGB(a),y=hexRGB(b);return "#"+x.map((v,i)=>Math.round(lerp(v,y[i],t)).toString(16).padStart(2,"0")).join("")};
/* sky keyframes by local solar hour: [hour, top, mid, horizon, stars, glow] */
const SKY=[[0,"#050b1f","#0b1d3d","#14264a",1,0],[5,"#0b1c3f","#2a3f6e","#7a5a7a",.6,.2],[6.5,"#3a5f9a","#e8a07a","#ffcf9a",0,1],[9,"#4a86d4","#86b7ec","#cfe3f7",0,.2],[13,"#2f78d6","#6aa9ee","#bcd9f6",0,0],
 [16.5,"#3b75c0","#8fb0e0","#f3c89a",0,.4],[18.5,"#243f7a","#c0708a","#ffb070",0,1],[20,"#0f1e4a","#3a3a6e","#8a5a6a",.4,.3],[21.5,"#060d24","#0b1a3a","#16284d",1,0],[24,"#050b1f","#0b1d3d","#14264a",1,0]];
function skyAt(h){let i=0;while(i<SKY.length-2&&h>=SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1],t=(h-a[0])/(b[0]-a[0]);
 return {top:mix(a[1],b[1],t),mid:mix(a[2],b[2],t),bot:mix(a[3],b[3],t),stars:lerp(a[4],b[4],t),glow:lerp(a[5],b[5],t)}}
/* local solar hour at a longitude (or a preview override) */
function hourAt(lon){const o={dawn:6.5,day:13,dusk:18.5,night:23}[S.timeMode];if(o!=null)return o;
 const d=new Date(),u=d.getUTCHours()+d.getUTCMinutes()/60;return((u+lon/15)%24+24)%24}
const rnd=seed=>{let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647}};

function windowSVG(h,k,vb="0 0 420 560"){
 const sk=skyAt(h),dark=Math.min(1,sk.stars*.9);
 const wTop=mix("#e8edf4","#1c2744",dark*.9),wMid=mix("#aab3c1","#101830",dark*.9),wBot=mix("#6c7686","#060a16",dark*.9),rim=mix(wTop,"#ffb36b",sk.glow*.85),lights=sk.stars>.15||sk.glow>.5;

function skyImage(h,W,Hh){

 const lit=mix(mix(sk.bot,"#ffffff",.6),"#2a3a60",dark*.7),shade=mix(mix(sk.mid,sk.bot,.5),"#1a2440",.35+.25*dark);
 const cv=document.createElement("canvas");cv.width=Math.round(W*2*dpr);cv.height=Math.round(Hh*dpr);
 const gl=cv.getContext("webgl",{preserveDrawingBuffer:true,antialias:false});if(!gl)return null;
 const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o};

 const u3=(n,c)=>gl.uniform3fv(gl.getUniformLocation(pr,n),hexRGB(c).map(v=>v/255));
 gl.uniform2f(gl.getUniformLocation(pr,"uRes"),cv.width,cv.height);
 u3("uTop",sk.top);u3("uMid",sk.mid);u3("uBot",sk.bot);u3("uLit",lit);u3("uShade",shade);
 gl.uniform1f(gl.getUniformLocation(pr,"uStars"),sk.stars);gl.uniform1f(gl.getUniformLocation(pr,"uGlow"),sk.glow);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

const FLIGHT_ICON="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z",LIME="#d6f23c";
function mapSVG(c,f,W,H,k){
 const o=[HOME.lon,HOME.lat],d=[c.lon,c.lat],top=96,bot=Math.round(H*.5),cx=W/2,cy=(top+bot)/2;
 const p=d3.geoMercator().fitExtent([[48,top],[W-48,bot]],{type:"LineString",coordinates:[o,d]});
 if(k!==1){const t0=p.translate();p.scale(p.scale()*k).translate([cx+(t0[0]-cx)*k,cy+(t0[1]-cy)*k])}
 const path=d3.geoPath(p),land=LAND50||world,cur=[f.pos.lon,f.pos.lat];
 const m=p(cur),nx=interp(HOME,c,Math.min(f.prog+.02,1)),n=p([nx.lon,nx.lat]),ang=Math.atan2(n[1]-m[1],n[0]-m[0])*180/Math.PI;
 const pin=(pt,l)=>{const q=p([pt.lon,pt.lat]);return `<g transform="translate(${q[0]},${q[1]})"><circle r="9" fill="none" stroke="#fff" stroke-opacity=".25"/><circle r="3.5" fill="#fff"/><text y="-17" text-anchor="middle" fill="#fff" font-size="10" font-weight="600" letter-spacing="1.5" font-family="Inter,Pretendard Variable,sans-serif">${l}</text></g>`};
 const done=f.prog>0?path({type:"LineString",coordinates:[o,cur]}):"";
 return `<svg viewBox="0 0 ${W} ${H}"><defs><filter id="lg" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter></defs>
 <rect width="${W}" height="${H}" fill="#12100e"/><path d="${path(d3.geoGraticule10())}" fill="none" stroke="#fff" stroke-opacity=".05"/>
 ${land?`<path d="${path(land)}" fill="#26221f" stroke="#3a3530" stroke-width=".6"/>`:""}
 ${done?`<path d="${done}" fill="none" stroke="${LIME}" stroke-width="7" stroke-opacity=".4" filter="url(#lg)"/><path d="${done}" fill="none" stroke="${LIME}" stroke-width="2.4" stroke-linecap="round"/>`:""}
 <path d="${path({type:"LineString",coordinates:[cur,d]})}" fill="none" stroke="${LIME}" stroke-opacity=".75" stroke-width="2.6" stroke-dasharray="1 7" stroke-linecap="round"/>
 ${pin({lon:o[0],lat:o[1]},"ICN")}${pin({lon:d[0],lat:d[1]},c.iata)}
 <g transform="translate(${m[0]},${m[1]}) rotate(${ang+90}) scale(1.35) translate(-12,-12)" style="filter:drop-shadow(0 0 7px rgba(214,242,60,.75))"><path d="${FLIGHT_ICON}" fill="#fff"/></g></svg>`;
}
function renderMap(){
 const t=cur();if(!t)return;
 const c=CITIES.find(x=>x.iata===t.iata),f=flight(c,t.steps),mv=$("#mapView"),pct=Math.round(f.prog*100);
 mv.innerHTML=`<div class="mvSvg">${mapSVG(c,f,mv.clientWidth,mv.clientHeight,mapK)}</div>
 <div class="mvZoom"><button data-mv="in">+</button><button data-mv="out">−</button></div>
 <div class="mvInfo"><div class="mvBig xw">${pct}%</div><div class="mvRt">ICN → ${c.iata} · ${c.name.toUpperCase()}</div><div class="mvLine"></div>
 <div class="mvCols"><span>${f.remain.toLocaleString()} STEPS LEFT</span><span>${Math.round((1-f.prog)*f.real).toLocaleString()} KM TO GO</span><span>${region(f.pos).replace("the ","").toUpperCase()}</span></div></div>
 <div class="mvHint">DOUBLE TAP TO RETURN</div>`;
}
function zoomOrigin(){
 const w=$(".win"),mv=$("#mapView");if(!w)return;
 const ph=$("#phone").getBoundingClientRect(),r=w.getBoundingClientRect();
 mv.style.transformOrigin=`${r.left+r.width/2-ph.left}px ${r.top+r.height/2-ph.top}px`;
}
function openMap(){
 if(mapOpen||!cur())return;mapOpen=true;mapK=1;
 const mv=$("#mapView");zoomOrigin();mv.classList.add("show");renderMap();
 if(!LAND50)loadLand50(()=>{if(mapOpen)renderMap()});
 void mv.offsetWidth;mv.classList.add("open");$(".win").classList.add("zin");vib(12);
}
function closeMap(){
 if(!mapOpen)return;mapOpen=false;const mv=$("#mapView");
 const w=$(".win");if(w)w.classList.remove("zin");
 zoomOrigin();mv.classList.remove("open");setTimeout(()=>{if(!mapOpen)mv.classList.remove("show")},650);
}
function onDouble(el,fn){
 let last=0,lx=0,ly=0;
 el.addEventListener("pointerup",e=>{if(e.target.closest("button"))return;const n=performance.now();
  if(n-last<320&&Math.hypot(e.clientX-lx,e.clientY-ly)<30){last=0;fn()}else{last=n;lx=e.clientX;ly=e.clientY}});
}
$("#mapView").addEventListener("click",e=>{const b=e.target.closest("[data-mv]");if(!b)return;const a=b.dataset.mv;
 {mapK=Math.min(4,Math.max(.6,a==="in"?mapK*1.4:mapK/1.4));renderMap()}});
onDouble($("#mapView"),closeMap);

/* ===== Render / events ===== */
function render(){
 const m=$("#main"),keep=m.scrollTop;
 if(!S.name){ $("#nav").style.display="none"; m.innerHTML=viewOnboard(); bindOnboard(); return }
 $("#nav").style.display="flex";
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 m.innerHTML=tab==="today"?viewToday():tab==="trips"?viewTrips():viewPassport();
 m.scrollTop=keep; bindView(); introTicket=false;
 m.onscroll=()=>{const a=m.querySelector(".art");if(a)a.style.transform=`translateY(${m.scrollTop*.35}px)`};m.onscroll();
}
function bindOnboard(){
 const nm=$("#nm"),box=$("#obTicket");
 const draw=()=>{const v=(nm.value||"YOUR NAME").toUpperCase();
  box.innerHTML=`<div class="face" style="position:relative;height:100px;margin:14px 0"><div class="small mono">Passenger</div><div class="mono" style="font-size:24px;font-weight:800;margin-top:6px">${v}<span style="animation:blink 1s infinite">▍</span></div><div class="barcode" style="height:20px"></div></div>`};
 document.head.insertAdjacentHTML("beforeend","<style>@keyframes blink{50%{opacity:0}}</style>");
 nm.oninput=()=>{draw();tone(1400,0,.02,.04)};draw();
 $("#obGo").onclick=()=>{ if(!nm.value.trim())return toast("이름을 입력하세요"); S.name=nm.value.trim(); save(); render() };
}
function bindView(){
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>addSteps(+b.dataset.s));
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>pick(b.dataset.d));
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=e=>{e.stopPropagation();S.planned.splice(+b.dataset.rm,1);save();render()});
 document.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{S.timeMode=b.dataset.tm;save();render()});
 document.querySelectorAll("[data-scroll]").forEach(b=>b.onclick=()=>$("#"+b.dataset.scroll).scrollIntoView({behavior:"smooth",block:"center"}));
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
 document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>share(b.dataset.share));
 const r=$("#reset");if(r)r.onclick=()=>{if(confirm("모든 데이터를 지울까요?")){localStorage.removeItem(KEY);location.reload()}};
 const tp=$("#togglePrem");if(tp)tp.onclick=()=>{S.premium=!S.premium;save();render()};
 bindTicket();
 { const w=$(".win:not(.frost)"); if(w) onDouble(w,openMap); }
 document.querySelectorAll(".win").forEach(initWindow);
 document.querySelectorAll(".win").forEach(initSky);
 document.querySelectorAll(".tc[data-card]").forEach(el=>el.onclick=()=>{cvFrom="card";openCard(el.dataset.card,el.getBoundingClientRect())});
 startWorld();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==="today")introTicket=true;render()});

function pick(iata){
 const c=CITIES.find(x=>x.iata===iata);
 if(S.trips.some(t=>t.iata===iata&&!t.done)||S.planned.includes(iata)) return toast("이미 예약된 여정이에요");
 // paywall triggers: premium city, or attempting the 4th city
 if((c.p||S.trips.length+S.planned.length>=3)&&!S.premium) return showPaywall();
 if(!cur()) return startTrip(iata);
 S.planned.push(iata);save();render();toast("📌 Upcoming에 추가됨");
}
function startTrip(iata){
 S.trips.push({iata,steps:0,startDate:today(),startTs:Date.now(),done:false});save();tab="today";introTicket=true;render();
 if(S.trips.length===1&&!S.premium){toast("🎫 첫 티켓 발권!");setTimeout(showPaywall,900)}
 else toast("🎫 새 티켓 발권!");
}
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=()=>ymd(new Date());

function addSteps(n){
 const t=cur();if(!t)return;
 t.steps+=n;S.today+=n;
 const c=CITIES.find(x=>x.iata===t.iata),f=flight(c,t.steps);
 if(f.prog>=1){t.done=true;t.completedDate=today();t.steps=Math.max(t.steps,f.req);if(!S.visited.includes(t.iata))S.visited.push(t.iata);save();render();land(t,c);return}
 // milestone ping like "passing over"
 save();render();
}
function land(t,c){
 const m=$("#landing");
 m.innerHTML=`<div class="small mono" style="color:var(--amber);letter-spacing:3px">WELCOME TO</div><h1 style="font-size:40px;margin:4px 0 14px">${c.name}</h1>
 <div style="position:relative;width:230px;margin:0 auto 22px">${cardHTML(c,t)}
 <svg class="bigstamp" style="position:absolute;right:-30px;bottom:-26px;width:112px;margin:0" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#0B0E14cc" stroke="currentColor" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>
 <text x="50" y="48" text-anchor="middle" font-size="24" font-weight="800" fill="currentColor" font-family="Inter,Pretendard Variable,sans-serif">${c.iata}</text><text x="50" y="62" text-anchor="middle" font-size="9" fill="currentColor" font-family="Inter,Pretendard Variable,sans-serif">ARRIVED</text></svg></div>
 <p style="margin:6px 0 16px">🎴 Travel Card 획득 · <b>${c.lmName}</b></p>
 <button class="btn" id="lgo">${S.planned.length?"다음 여정 시작 ✈️":"다음 목적지 고르기"}</button><button class="btn ghost" id="lsh" style="margin-top:8px">📸 공유하기</button>`;
 m.classList.add("show");dingdong();setTimeout(()=>vib([60,40,200]),900);
 $("#lgo").onclick=()=>{m.classList.remove("show");if(S.planned.length)startTrip(S.planned.shift());else{tab="trips";render()}};
 $("#lsh").onclick=()=>share(c.iata);
}
function showPaywall(){
 const m=$("#paywall");
 m.innerHTML=`<div class="small mono" style="color:var(--amber);letter-spacing:3px">AEROSTEP FIRST CLASS</div><h1>Upgrade your journey</h1>
 <div class="perk">🌍 60+ 프리미엄 도시<br>🏝️ Dynamic Island & Live Activities 무제한<br>🎫 골드 / 레트로 티켓 스킨<br>⌚ Apple Watch 컴플리케이션</div>
 <button class="btn" id="pw1">3일 무료 체험 시작 · $19.99/년</button><button class="btn ghost" id="pw2" style="margin-top:8px">$2.99 / 월</button>
 <button id="pwx" style="background:none;border:0;color:var(--dim);margin-top:14px;cursor:pointer">나중에</button>
 <p class="hint">(프로토타입: 버튼을 누르면 구독이 활성화된 것으로 처리됩니다)</p>`;
 m.classList.add("show");
 const ok=()=>{S.premium=true;save();m.classList.remove("show");render();toast("✨ First Class 활성화")};
 $("#pw1").onclick=ok;$("#pw2").onclick=ok;$("#pwx").onclick=()=>m.classList.remove("show");
}

/* ===== Share: 9:16 story image ===== */
function share(iata){
 const t=S.trips.find(x=>x.iata===iata&&x.done),c=CITIES.find(x=>x.iata===iata);if(!t)return;
 const cv=document.createElement("canvas");cv.width=1080;cv.height=1920;const g=cv.getContext("2d");
 g.fillStyle="#0B0E14";g.fillRect(0,0,1080,1920);
 g.fillStyle="#FFB020";g.font="600 34px Inter,Pretendard Variable,sans-serif";g.fillText("A E R O S T E P",80,140);
 // paper ticket
 g.fillStyle="#EFE6D2";g.beginPath();g.roundRect(70,420,940,620,36);g.fill();
 g.fillStyle="#0B0E14";[420+310].forEach(y=>{g.beginPath();g.arc(70,y,34,0,7);g.arc(1010,y,34,0,7);g.fill()});
 g.fillStyle="#2a2418";g.font="800 190px Inter,Pretendard Variable,sans-serif";g.fillText("ICN",130,680);g.textAlign="right";g.fillText(c.iata,950,680);g.textAlign="left";
 g.font="90px Inter,Pretendard Variable,sans-serif";g.fillText("✈︎",490,640);
 g.font="600 34px Inter,Pretendard Variable,sans-serif";g.fillText(S.name.toUpperCase(),130,790);g.fillText(t.completedDate,130,850);
 for(let x=130;x<940;x+=14){g.fillRect(x,920,x%3?4:8,70)}
 g.fillStyle="#F2F4F8";g.font="700 76px Inter,Pretendard Variable,sans-serif";
 const lines=[`${t.steps.toLocaleString()}걸음으로`,`서울에서 ${c.name}까지`,`비행 완료`];lines.forEach((l,i)=>g.fillText(l,80,1220+i*100));
 g.font="150px Inter,Pretendard Variable,sans-serif";g.fillText(c.lm,80,1620);
 g.fillStyle="#8892a6";g.font="500 30px Inter,Pretendard Variable,sans-serif";g.fillText("Walk. Fly. Collect.  ·  aerostep.app",80,1800);
 // QR placeholder
 g.fillStyle="#fff";g.fillRect(800,1640,180,180);g.fillStyle="#000";for(let i=0;i<9;i++)for(let j=0;j<9;j++)if((i*7+j*13+i*j)%3==0)g.fillRect(812+i*18,1652+j*18,16,16);
 cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`aerostep-${iata}.png`;a.click();toast("이미지 저장됨")});
}

/* ===== Boot ===== */
render();
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json").then(r=>r.json()).then(w=>{world=topojson.feature(w,w.objects.land);render()}).catch(()=>{});
</script>
